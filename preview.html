<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabor · Preview</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; overscroll-behavior: none; background: #E9E7E3; font-family: system-ui, sans-serif; color: #22201C; }
  .bar { display: flex; gap: 16px; align-items: center; padding: 10px 24px; background: #fff; border-bottom: 1px solid #ddd; font-size: 14px; }
  .bar a { color: #22201C; }
  .stage { display: flex; gap: 32px; padding: 16px 24px 20px; min-height: 0; }
  .label { height: 18px; margin-bottom: 6px; font-size: 13px; color: #5C574F; white-space: nowrap; }
  .phone-slot { flex: none; }
  .phone-box { position: relative; }
  .phone { position: absolute; top: 0; left: 0; width: 410px; height: 864px; border: 10px solid #1B1B1B; border-radius: 48px; box-sizing: border-box; overflow: hidden; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.18); transform-origin: 0 0; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .desktop { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .desktop__frame { position: relative; flex: 1 1 auto; min-height: 0; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.12); }
  .desktop iframe { position: absolute; top: 0; left: 0; border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
  <div class="bar">
    <strong>Preview</strong>
    <span data-page></span>
    <a href="components.html">Components</a>
    <a data-open target="_blank">Open page alone</a>
  </div>
  <div class="stage" data-stage>
    <div class="phone-slot">
      <div class="label" data-phone-label>Phone · 390 × 844</div>
      <div class="phone-box" data-phone-box><div class="phone" data-phone-shell><iframe data-phone title="Phone preview"></iframe></div></div>
    </div>
    <div class="desktop">
      <div class="label" data-desktop-label>Desktop · 1280</div>
      <div class="desktop__frame" data-desktop-frame><iframe data-desktop title="Desktop preview"></iframe></div>
    </div>
  </div>
<script>
  const PHONE = { width: 410, height: 864 };
  const page = new URLSearchParams(location.search).get("page") || "discover.html";
  const safe = /^[a-z0-9-]+\.html(\?[a-z0-9=&-]*)?$/.test(page) ? page : "discover.html";
  const phone = document.querySelector("[data-phone]");
  const desktop = document.querySelector("[data-desktop]");

  function contain(frame, css) {
    frame.addEventListener("load", () => {
      const style = frame.contentDocument.createElement("style");
      style.textContent = css;
      frame.contentDocument.head.append(style);
    });
  }

  function layout() {
    const stage = document.querySelector("[data-stage]");
    const label = document.querySelector("[data-phone-label]");
    const styles = getComputedStyle(stage);
    const height = stage.clientHeight - parseFloat(styles.paddingTop) - parseFloat(styles.paddingBottom) - label.offsetHeight - parseFloat(getComputedStyle(label).marginBottom);
    const phoneScale = Math.min(1, height / PHONE.height);
    const box = document.querySelector("[data-phone-box]");
    box.style.width = `${PHONE.width * phoneScale}px`;
    box.style.height = `${PHONE.height * phoneScale}px`;
    document.querySelector("[data-phone-shell]").style.transform = `scale(${phoneScale})`;
    label.textContent = `Phone · 390 × 844${phoneScale < 1 ? ` · ${Math.round(phoneScale * 100)}%` : ""}`;
    const frame = document.querySelector("[data-desktop-frame]");
    const deskScale = Math.min(1, frame.clientWidth / 1280);
    const deskWidth = Math.round(frame.clientWidth / deskScale);
    const deskHeight = Math.round(frame.clientHeight / deskScale);
    desktop.style.width = `${deskWidth}px`;
    desktop.style.height = `${deskHeight}px`;
    desktop.style.transform = `scale(${deskScale})`;
    document.querySelector("[data-desktop-label]").textContent = `Desktop · ${deskWidth} × ${deskHeight}${deskScale < 1 ? ` · ${Math.round(deskScale * 100)}%` : ""}`;
  }

  contain(phone, "html { scrollbar-width: none; overscroll-behavior: none; }");
  contain(desktop, "html { overscroll-behavior: none; }");
  phone.src = safe;
  desktop.src = safe;
  document.querySelector("[data-open]").href = safe;
  document.querySelector("[data-page]").textContent = safe;
  new ResizeObserver(layout).observe(document.querySelector("[data-stage]"));
</script>
</body>
</html>

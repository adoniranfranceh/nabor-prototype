<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabor · Brand assets</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #FAFAF9; color: #22201C; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px; display: flex; flex-direction: column; gap: 32px; }
  h1 { margin: 0; font-size: 24px; }
  p { margin: 0; color: #5C574F; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  figure { margin: 0; border: 1px solid #ECE9E4; border-radius: 12px; overflow: hidden; background: #fff; }
  .tile { height: 200px; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .tile img { max-width: 100%; max-height: 100%; }
  .tile--coral { background: #F63D38; }
  .tile--ink { background: #22201C; }
  figcaption { padding: 10px 14px; font: 13px ui-monospace, monospace; border-top: 1px solid #ECE9E4; }
  .sizes { display: flex; align-items: end; gap: 24px; padding: 24px; background: #fff; border: 1px solid #ECE9E4; border-radius: 12px; }
  .sizes img { display: block; }
</style>
</head>
<body>
<main>
  <h1>Nabor brand assets</h1>
  <p>Traced from "Nabor Minimalist Coral Logo DRAFT.png". Files in assets/brand/. Coral #F63D38, ink #434343.</p>

  <div class="grid">
    <figure><div class="tile"><img src="assets/brand/nabor-mark.svg" alt=""></div><figcaption>nabor-mark.svg</figcaption></figure>
    <figure><div class="tile"><img src="assets/brand/nabor-wordmark.svg" alt=""></div><figcaption>nabor-wordmark.svg</figcaption></figure>
    <figure><div class="tile"><img src="assets/brand/nabor-logo-horizontal.svg" alt=""></div><figcaption>nabor-logo-horizontal.svg</figcaption></figure>
    <figure><div class="tile"><img src="assets/brand/nabor-logo-stacked.svg" alt=""></div><figcaption>nabor-logo-stacked.svg</figcaption></figure>
    <figure><div class="tile"><img src="assets/brand/nabor-tagline.svg" alt=""></div><figcaption>nabor-tagline.svg</figcaption></figure>
    <figure><div class="tile tile--coral"><img src="assets/brand/nabor-mark-white.svg" alt=""></div><figcaption>nabor-mark-white.svg</figcaption></figure>
    <figure><div class="tile tile--coral"><img src="assets/brand/nabor-logo-horizontal-white.svg" alt=""></div><figcaption>nabor-logo-horizontal-white.svg</figcaption></figure>
    <figure><div class="tile tile--ink"><img src="assets/brand/nabor-wordmark-white.svg" alt=""></div><figcaption>nabor-wordmark-white.svg</figcaption></figure>
  </div>

  <h1>Small sizes</h1>
  <div class="sizes">
    <img src="assets/brand/nabor-mark.svg" alt="" height="16">
    <img src="assets/brand/nabor-mark.svg" alt="" height="24">
    <img src="assets/brand/nabor-mark.svg" alt="" height="32">
    <img src="assets/brand/nabor-logo-horizontal.svg" alt="" height="24">
    <img src="assets/brand/nabor-logo-horizontal.svg" alt="" height="32">
  </div>
</main>
</body>
</html>
